[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "facecheck"
version = "0.1.0"
description = "Minimal 1:1 face verification service for SFA attendance prototypes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Imam Hambali", email = "imam-db@users.noreply.github.com" }]
keywords = ["face-verification", "opencv", "sface", "yunet", "attendance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "opencv-contrib-python-headless>=4.10,<5",
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.6",
  "pillow>=10",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "ruff>=0.7",
]
eval = [
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
]
postgres = [
  "psycopg[binary]>=3.2",
]

[project.scripts]
facecheck = "facecheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/facecheck"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["model: requires downloaded YuNet/SFace ONNX models"]
filterwarnings = ["error::DeprecationWarning:facecheck.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
